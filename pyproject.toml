[project]
name = "pcb-agent"
version = "0.1.0"
description = "Deterministic safety core for Diode PCB agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pcb-agent = "pcb_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.pyright]
pythonVersion = "3.11"
include = ["src"]
typeCheckingMode = "standard"
reportUnusedImport = "error"